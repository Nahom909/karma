      <figure class="stage stage--classic" data-stage="classic">
        <img class="stage__shadow" src="assets/photo/classic/shadow.webp" alt="" width="1100" height="1500" decoding="async">
        <img class="stage__final" src="assets/photo/classic/final.webp" srcset="assets/photo/classic/final-m.webp 600w, assets/photo/classic/final.webp 1100w" sizes="(max-width: 767px) 40vh, 58vh" data-attr="alt=hero.bild_beschreibung" alt="" width="1100" height="1500" fetchpriority="high" decoding="async">
      </figure>

      <article class="copy copy--classic" id="sorten" aria-labelledby="name-classic" data-copy="classic">
        <p class="copy__kicker"><span data-c="signature.titel"></span><span class="copy__count">01 / 04</span></p>
        <h2 class="copy__name" id="name-classic" data-rich="signature.sorten.0.name" data-rich-italic="signature.sorten.0.kursiv"></h2>
        <p class="copy__sub" data-c="signature.sorten.0.untertitel"></p>
        <p class="copy__text" data-c="signature.sorten.0.beschreibung"></p>
        <div class="copy__meta">
          <p class="copy__label" data-c="signature.zutaten_titel"></p>
          <ol class="copy__ingredients" data-list="signature.sorten.0.zutaten"></ol>
          <p class="copy__price"><span data-c="signature.groesse"></span><strong data-c="signature.sorten.0.preis"></strong></p>
        </div>
      </article>
    </div>
  </div>

  <!-- 2 · Caramel Crunch: der Becher füllt sich von unten mit Farbe, die Haube landet obendrauf -->
  <section class="scene scene--caramel" id="caramel" aria-labelledby="name-caramel" data-scene="caramel">
    <div class="scene__pin" data-pin>
      <p class="bigtype bigtype--caramel" aria-hidden="true" data-bigtype><span data-c="signature.sorten.1.name"></span> <span data-c="signature.sorten.1.name"></span> <span data-c="signature.sorten.1.name"></span></p>
      <figure class="stage stage--caramel" data-stage="caramel">
        <img class="stage__shadow" src="assets/photo/caramel/shadow.webp" alt="" width="1100" height="1500" loading="lazy" decoding="async">
        <img class="stage__final" src="assets/photo/caramel/final.webp" srcset="assets/photo/caramel/final-m.webp 600w, assets/photo/caramel/final.webp 1100w" sizes="(max-width: 767px) 40vh, 58vh" data-attr="alt=signature.sorten.1.bild_beschreibung" alt="" width="1100" height="1500" loading="lazy" decoding="async">
      </figure>
      <article class="copy copy--caramel" data-copy="caramel">
        <p class="copy__kicker"><span data-c="signature.titel"></span><span class="copy__count">02 / 04</span></p>
        <h2 class="copy__name" id="name-caramel" data-rich="signature.sorten.1.name" data-rich-italic="signature.sorten.1.kursiv"></h2>
        <p class="copy__sub" data-c="signature.sorten.1.untertitel"></p>
        <p class="copy__text" data-c="signature.sorten.1.beschreibung"></p>
        <div class="copy__meta">
          <p class="copy__label" data-c="signature.zutaten_titel"></p>
          <ol class="copy__ingredients" data-list="signature.sorten.1.zutaten"></ol>
          <p class="copy__price"><span data-c="signature.groesse"></span><strong data-c="signature.sorten.1.preis"></strong></p>
        </div>
      </article>
    </div>
  </section>

  <!-- 3 · Peanut Power: der Becher setzt sich Schicht für Schicht zusammen, dann kippt er sanft -->
  <section class="scene scene--peanut" id="peanut" aria-labelledby="name-peanut" data-scene="peanut">
    <div class="scene__pin" data-pin>
      <p class="bigtype bigtype--peanut-a" aria-hidden="true" data-bigtype-a>Peanut Peanut Peanut</p>
      <p class="bigtype bigtype--peanut-b" aria-hidden="true" data-bigtype-b>Power Power Power</p>
      <figure class="stage stage--peanut" data-stage="peanut">
        <img class="stage__shadow" src="assets/photo/peanut/shadow.webp" alt="" width="1100" height="1500" loading="lazy" decoding="async">
        <img class="stage__final" src="assets/photo/peanut/final.webp" srcset="assets/photo/peanut/final-m.webp 600w, assets/photo/peanut/final.webp 1100w" sizes="(max-width: 767px) 40vh, 58vh" data-attr="alt=signature.sorten.2.bild_beschreibung" alt="" width="1100" height="1500" loading="lazy" decoding="async">
      </figure>
      <article class="copy copy--peanut" data-copy="peanut">
        <div class="copy__col copy__col--a">
          <p class="copy__kicker"><span data-c="signature.titel"></span><span class="copy__count">03 / 04</span></p>
          <h2 class="copy__name" id="name-peanut" data-rich="signature.sorten.2.name" data-rich-italic="signature.sorten.2.kursiv"></h2>
          <p class="copy__sub" data-c="signature.sorten.2.untertitel"></p>
        </div>
        <div class="copy__col copy__col--b">
          <p class="copy__text" data-c="signature.sorten.2.beschreibung"></p>
          <div class="copy__meta">
            <p class="copy__label" data-c="signature.zutaten_titel"></p>
            <ol class="copy__ingredients" data-list="signature.sorten.2.zutaten"></ol>
            <p class="copy__price"><span data-c="signature.groesse"></span><strong data-c="signature.sorten.2.preis"></strong></p>
          </div>
        </div>
      </article>
    </div>
  </section>

  <!-- 4 · Berry Blast: Beeren explodieren nach außen und ziehen sich wieder zusammen -->
  <section class="scene scene--berry" id="berry" aria-labelledby="name-berry" data-scene="berry">
    <div class="scene__pin" data-pin>
      <figure class="stage stage--berry" data-stage="berry">
        <img class="stage__shadow" src="assets/photo/berry/shadow.webp" alt="" width="1100" height="1500" loading="lazy" decoding="async">
        <img class="stage__final" src="assets/photo/berry/final.webp" srcset="assets/photo/berry/final-m.webp 600w, assets/photo/berry/final.webp 1100w" sizes="(max-width: 767px) 40vh, 58vh" data-attr="alt=signature.sorten.3.bild_beschreibung" alt="" width="1100" height="1500" loading="lazy" decoding="async">
      </figure>
      <article class="copy copy--berry" data-copy="berry">
        <p class="copy__kicker"><span data-c="signature.titel"></span><span class="copy__count">04 / 04</span></p>
        <h2 class="copy__name" id="name-berry" data-rich="signature.sorten.3.name" data-rich-italic="signature.sorten.3.kursiv"></h2>
        <p class="copy__sub" data-c="signature.sorten.3.untertitel"></p>
        <p class="copy__text" data-c="signature.sorten.3.beschreibung"></p>
        <div class="copy__meta">
          <p class="copy__label" data-c="signature.zutaten_titel"></p>
          <ol class="copy__ingredients" data-list="signature.sorten.3.zutaten"></ol>
          <p class="copy__price"><span data-c="signature.groesse"></span><strong data-c="signature.sorten.3.preis"></strong></p>
        </div>
      </article>
    </div>
  </section>

  <!-- 5 · Iced Strawberry Matcha: Schichten bauen sich nacheinander auf, Hintergrund läuft von Rot zu Grün -->
  <section class="scene scene--matcha" id="matcha" aria-labelledby="name-matcha" data-scene="matcha">
    <div class="scene__pin" data-pin>
      <figure class="stage stage--matcha" data-stage="matcha">
        <img class="stage__shadow" src="assets/render/matcha/shadow.webp" alt="" width="1100" height="1500" loading="lazy" decoding="async">
        <img class="stage__final" src="assets/render/matcha/final.webp" srcset="assets/render/matcha/final-m.webp 600w, assets/render/matcha/final.webp 1100w" sizes="(max-width: 767px) 40vh, 58vh" data-attr="alt=matcha.bild_beschreibung" alt="" width="1100" height="1500" loading="lazy" decoding="async">
        <figcaption class="render-badge" data-c="bildkennzeichnung.bild_text"></figcaption>
      </figure>
      <article class="copy copy--matcha" data-copy="matcha">
        <p class="copy__kicker" data-c="matcha.kicker"></p>
        <h2 class="copy__name copy__name--matcha" id="name-matcha" data-rich="matcha.titel" data-rich-italic="matcha.kursiv"></h2>
        <p class="copy__text" data-c="matcha.beschreibung"></p>
        <p class="copy__price"><span data-c="signature.groesse"></span><strong data-c="matcha.preis"></strong></p>
      </article>
      <ol class="layers" data-layers aria-label="Schichten"></ol>
    </div>
  </section>

  <!-- 6 · Impressionen: echte Fotos aus dem Café (vom Café bereitgestellt) -->
  <section class="gallery" id="impressionen" aria-labelledby="gallery-title" data-gallery>
    <div class="wrap gallery__head">
      <h2 class="h2" id="gallery-title" data-c="impressionen.titel" data-reveal></h2>
      <p class="lead" data-c="impressionen.text" data-reveal></p>
      <a class="textlink" data-instagram target="_blank" rel="noopener" data-reveal>
        <svg class="ico" aria-hidden="true"><use href="#i-instagram"/></svg>
        <span data-c="impressionen.instagram_text"></span>
        <span class="textlink__handle" data-c="cafe.instagram_name"></span>
      </a>
    </div>
    <ul class="wrap gallery__grid" data-gallery-grid data-attr="aria-label=bedienhilfen.galerie_label"></ul>
  </section>

  <!-- 7 · Speisekarte (Beispiel) -->
  <section class="menu" id="karte" aria-labelledby="menu-title">
    <div class="wrap">
      <div class="menu__head">
        <h2 class="h2" id="menu-title" data-c="speisekarte.titel" data-reveal></h2>
        <p class="lead" data-c="speisekarte.einleitung" data-reveal></p>
        <p class="note" data-c="speisekarte.hinweis" data-reveal></p>
      </div>
      <nav class="menu__tabs" aria-label="Kategorien" data-menu-tabs></nav>
      <div class="menu__grid" data-menu></div>
    </div>
  </section>

  <!-- 8 · Besuch uns -->
  <section class="visit" id="besuch" aria-labelledby="visit-title">
    <div class="wrap visit__grid">
      <div class="visit__main">
        <p class="kicker" data-c="besuch.kicker" data-reveal></p>
        <h2 class="visit__title" id="visit-title" data-rich="besuch.titel" data-rich-italic="besuch.kursiv"></h2>
        <p class="lead" data-c="besuch.text" data-reveal></p>
        <address class="visit__address" data-reveal>
          <span data-c="cafe.name"></span>
          <span class="visit__street" data-c="cafe.strasse"></span>
          <span><span data-c="cafe.plz"></span> <span data-c="cafe.ort"></span></span>
        </address>
        <div class="actions" data-reveal>
          <a class="btn" data-route target="_blank" rel="noopener">
            <span data-c="besuch.route_button"></span>
            <span class="btn__icon" aria-hidden="true"><svg class="ico"><use href="#i-arrow-up-right"/></svg></span>
          </a>
          <a class="btn btn--ghost" data-instagram target="_blank" rel="noopener">
            <span data-c="besuch.instagram_button"></span>
            <span class="btn__icon" aria-hidden="true"><svg class="ico"><use href="#i-instagram"/></svg></span>
          </a>
        </div>
      </div>
      <div class="visit__side">
        <div class="visit__block" data-reveal>
          <h3 class="visit__h3" data-c="oeffnungszeiten.titel"></h3>
          <p class="visit__big" data-c="oeffnungszeiten.zusammenfassung"></p>
          <p class="status" data-status-long></p>
          <dl class="hours" data-hours></dl>
        </div>
        <a class="visit__block visit__rating" data-google target="_blank" rel="noopener" data-reveal>
          <span class="visit__score" data-c="cafe.google_sterne"></span>
          <span class="visit__rating-meta">
            <span class="stars stars--lg" aria-hidden="true"></span>
            <span><span data-c="cafe.google_anzahl_bewertungen"></span> <span data-c="besuch.bewertungen_wort"></span> <span data-c="besuch.bewertung_text"></span></span>
          </span>
          <svg class="ico visit__arrow" aria-hidden="true"><use href="#i-arrow-up-right"/></svg>
        </a>
      </div>
    </div>
    <div class="visit__mark" aria-hidden="true" data-visit-mark>
      <svg viewBox="-4 4 308 118"><use href="#wordmark"/></svg>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__grid">
    <p class="footer__brand" data-c="cafe.name"></p>
    <p class="footer__addr"><span data-c="cafe.strasse"></span>, <span data-c="cafe.plz"></span> <span data-c="cafe.ort"></span></p>
    <nav class="footer__links" aria-label="Rechtliches">
      <a data-attr="href=footer.impressum_link" data-c="footer.impressum_text"></a>
      <a data-attr="href=footer.datenschutz_link" data-c="footer.datenschutz_text"></a>
      <a data-instagram target="_blank" rel="noopener" data-c="cafe.instagram_name"></a>
    </nav>
    <p class="footer__note" data-render-footer></p>
    <p class="footer__note footer__credits" data-credits></p>
    <p class="footer__note" data-c="footer.demo_hinweis"></p>
    <p class="footer__copy" data-c="footer.copyright"></p>
  </div>
</footer>
</body>
</html>
